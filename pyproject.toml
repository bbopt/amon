[build-system]
requires = ["setuptools>61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "amon_bb"
version = "0.8.2"
description = "Wind farm blackbox CLI app"
authors = [{ name = "Léon Biner", email = "leon.biner@polymtl.ca" }]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [ 
  "py_wake==2.6.12", 
  "numpy==2.5.1",
  "matplotlib==3.11.1",
  "shapely==2.1.2",
  "pathlib==1.0.1",     # Optional — part of stdlib in 3.4+, can be removed
  "requests==2.34.2",
  "scipy==1.18.0",
  "pandas==3.0.5",
  "geopandas==1.1.4",
  "windrose==1.10.0",
  "pyshp==3.1.6",       # use this instead of "shapefile"
  "flask==3.1.3",
  "xarray==2026.7.0"
]
[project.scripts]
amon = "amon.src.main:main"
[tool.setuptools.packages.find]
include = ["amon*"]
[tool.setuptools.package-data]
amon = ["data/**/*", "instances/**/*", "starting_pts/**/*"]
